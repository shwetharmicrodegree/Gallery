<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Gallery - {% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">
    <nav class="bg-blue-600 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'image_list' %}" class="text-white text-2xl font-bold rounded-md px-3 py-1 hover:bg-blue-700 transition duration-300">
                My Gallery
            </a>
            <div>
                <a href="{% url 'upload_image' %}" class="bg-white text-blue-600 px-4 py-2 rounded-md font-semibold hover:bg-gray-200 transition duration-300 shadow-sm">
                    Upload Image
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center mt-auto">
        <div class="container mx-auto">
            &copy; {% now "Y" %} Django Gallery App. All rights reserved.
        </div>
    </footer>
</body>
</html>
